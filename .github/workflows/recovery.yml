name: Scripture 365 production

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripture365-production
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install wallpaper tooling
        run: python3 -m pip install --disable-pip-version-check requests pillow

      - name: Collect 365 existing licensed 4K Christian photographs
        working-directory: source
        run: python3 tool/build_wallpapers.py

      - name: Validate wallpaper integrity and licensing
        working-directory: source
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('assets/wallpapers')
          manifest = json.loads((root / 'manifest.json').read_text())
          items = manifest['wallpapers']
          assert manifest['count'] == 365
          assert len(items) == 365
          assert [item['day'] for item in items] == list(range(1, 366))
          assert len({item['sourceId'] for item in items}) == 365
          assert len({item['previewSha256'] for item in items}) == 365
          assert all(item['license'] and item['licenseUrl'] and item['sourceUrl'] for item in items)
          assert all(item['download4kUrl'].startswith('https://') for item in items)
          assert all(max(item['originalWidth'], item['originalHeight']) >= 3840 for item in items)
          assert all(min(item['originalWidth'], item['originalHeight']) >= 2160 for item in items)
          for day, item in enumerate(items, 1):
              path = root / f'day_{day:03d}.webp'
              assert path.is_file() and path.stat().st_size > 20000
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['previewSha256']
          print('Validated 365 different, licensed, 4K-qualified internet photographs.')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        working-directory: source
        run: flutter create --platforms=web,android,ios --project-name scripture365 .

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Validate 365-day Scripture content
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('assets/content/year_365.json').read_text())
          entries = data['entries']
          assert len(entries) == 365
          assert [entry['doy'] for entry in entries] == list(range(1, 366))
          PY

      - name: Analyze
        working-directory: source
        run: flutter analyze

      - name: Test
        working-directory: source
        run: flutter test

      - name: Build production web app
        working-directory: source
        run: flutter build web --release --base-href /APP-IDEA/

      - name: Build Android release APK
        working-directory: source
        run: flutter build apk --release

      - name: Preserve web and Android releases
        uses: actions/upload-artifact@v4
        with:
          name: scripture365-${{ github.sha }}
          path: |
            source/build/web
            source/build/app/outputs/flutter-apk/app-release.apk
            source/assets/wallpapers/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish live mobile-first app
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: source/build/web
          keep_files: true
