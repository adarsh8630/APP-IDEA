name: Scripture 365 recovery

on:
  push:
    branches: [recovery-production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripture365-recovery
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        working-directory: source
        run: flutter create --platforms=web,android,ios --project-name scripture365 .

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze
        working-directory: source
        run: flutter analyze

      - name: Test
        working-directory: source
        run: flutter test

      - name: Build production web app
        working-directory: source
        run: flutter build web --release --base-href /APP-IDEA/

      - name: Publish verified build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          publish_branch: production-web
          publish_dir: source/build/web
          force_orphan: true
