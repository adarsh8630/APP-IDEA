name: Scripture 365 production

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scripture365-production
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install wallpaper tooling
        run: python3 -m pip install --disable-pip-version-check requests pillow

      - name: Collect 365 existing licensed 4K Christian photographs
        working-directory: source
        run: python3 tool/build_wallpapers.py

      - name: Validate wallpaper integrity and licensing
        working-directory: source
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('assets/wallpapers')
          manifest = json.loads((root / 'manifest.json').read_text())
          items = manifest['wallpapers']
          assert manifest['count'] == 365
          assert len(items) == 365
          assert [item['day'] for item in items] == list(range(1, 366))
          assert len({item['sourceId'] for item in items}) == 365
          assert len({item['previewSha256'] for item in items}) == 365
          assert all(item['license'] and item['sourceUrl'] for item in items)
          assert all(item['download4kUrl'].startswith('https://') for item in items)
          assert all(max(item['originalWidth'], item['originalHeight']) >= 3840 for item in items)
          assert all(min(item['originalWidth'], item['originalHeight']) >= 2160 for item in items)
          for day, item in enumerate(items, 1):
              path = root / f'day_{day:03d}.webp'
              assert path.is_file() and path.stat().st_size > 5000
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['previewSha256']
          print('Validated 365 different, licensed, 4K-qualified internet photographs.')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        working-directory: source
        run: flutter create --platforms=web,android,ios --org com.adarsh8630 --project-name scripture365 .

      - name: Apply Scripture 365 native and web branding
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          from PIL import Image

          source = Image.open('../icons/Icon-512.png').convert('RGB')
          android_sizes = {
              'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192,
          }
          for folder, size in android_sizes.items():
              target = Path('android/app/src/main/res') / folder / 'ic_launcher.png'
              target.parent.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(target)

          web_icons = {
              'web/favicon.png': 32, 'web/icons/Icon-192.png': 192,
              'web/icons/Icon-512.png': 512,
              'web/icons/Icon-maskable-192.png': 192,
              'web/icons/Icon-maskable-512.png': 512,
          }
          for filename, size in web_icons.items():
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              source.resize((size, size), Image.Resampling.LANCZOS).save(target)

          app_icons = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          contents_path = app_icons / 'Contents.json'
          contents = json.loads(contents_path.read_text())
          for item in contents.get('images', []):
              filename = item.get('filename')
              size_text = item.get('size')
              scale_text = item.get('scale')
              if not filename or not size_text or not scale_text:
                  continue
              points = float(size_text.split('x')[0])
              scale = float(scale_text.rstrip('x'))
              pixels = round(points * scale)
              source.resize((pixels, pixels), Image.Resampling.LANCZOS).save(app_icons / filename)

          plist_path = Path('ios/Runner/Info.plist')
          with plist_path.open('rb') as handle:
              plist = plistlib.load(handle)
          plist['CFBundleDisplayName'] = 'Scripture 365'
          plist['CFBundleName'] = 'Scripture 365'
          with plist_path.open('wb') as handle:
              plistlib.dump(plist, handle)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(manifest.read_text().replace(
              'android:label="scripture365"', 'android:label="Scripture 365"'
          ))

          web_manifest = Path('web/manifest.json')
          web_data = json.loads(web_manifest.read_text())
          web_data['name'] = 'Scripture 365'
          web_data['short_name'] = 'Scripture 365'
          web_manifest.write_text(json.dumps(web_data, indent=2))
          PY

      - name: Configure Android scheduled notifications
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'
          )
          receivers = '''
                  <receiver android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
          '''
          text = text.replace('    </application>', receivers + '    </application>')
          path.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          gradle_text = gradle.read_text()
          gradle_text = gradle_text.replace(
              '    compileOptions {\n',
              '    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n',
              1,
          )
          if 'coreLibraryDesugaring(' not in gradle_text:
              gradle_text += '''
dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
'''
          gradle.write_text(gradle_text)
          PY

      - name: Configure Android release signing when credentials are available
        working-directory: source
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          encoded = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not encoded:
              print('Android signing secrets are absent; CI compatibility artifact will use the generated development signing configuration.')
              raise SystemExit(0)

          app = Path('android/app')
          (app / 'upload-keystore.jks').write_bytes(base64.b64decode(encoded))
          properties = Path('android/key.properties')
          properties.write_text(
              'storePassword=' + os.environ['ANDROID_KEYSTORE_PASSWORD'] + '\n'
              'keyPassword=' + os.environ['ANDROID_KEY_PASSWORD'] + '\n'
              'keyAlias=' + os.environ['ANDROID_KEY_ALIAS'] + '\n'
              'storeFile=upload-keystore.jks\n'
          )

          gradle = app / 'build.gradle.kts'
          text = gradle.read_text()
          prefix = '''import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
          text = prefix + text
          text = text.replace('    buildTypes {', signing + '    buildTypes {')
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          gradle.write_text(text)
          print('Configured production Android upload signing.')
          PY

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Validate 365-day Scripture content
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('assets/content/year_365.json').read_text())
          entries = data['entries']
          assert len(entries) == 365
          assert [entry['doy'] for entry in entries] == list(range(1, 366))
          PY

      - name: Analyze
        working-directory: source
        run: flutter analyze

      - name: Test
        working-directory: source
        run: flutter test

      - name: Build production web app
        working-directory: source
        run: flutter build web --release --base-href /APP-IDEA/

      - name: Build Android release APK
        working-directory: source
        run: flutter build apk --release --dart-define=RC_ANDROID_API_KEY=${{ secrets.RC_ANDROID_API_KEY }}

      - name: Build Android Play App Bundle
        working-directory: source
        run: flutter build appbundle --release --dart-define=RC_ANDROID_API_KEY=${{ secrets.RC_ANDROID_API_KEY }}

      - name: Preserve web and Android releases
        uses: actions/upload-artifact@v4
        with:
          name: scripture365-${{ github.sha }}
          path: |
            source/build/web
            source/build/app/outputs/flutter-apk/app-release.apk
            source/build/app/outputs/bundle/release/app-release.aab
            source/assets/wallpapers/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish live mobile-first app
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: source/build/web
          keep_files: true
