name: iOS compatibility verification

on:
  push:
    branches: [preview]
    paths:
      - source/lib/**
      - source/pubspec.yaml
      - .github/workflows/ios-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate iOS project
        working-directory: source
        run: flutter create --platforms=ios --org com.adarsh8630 --project-name scripture365 .

      - name: Prepare verified-shape wallpaper assets for compilation
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('assets/wallpapers')
          source = root / 'sunrise.webp'
          credits = []
          for day in range(1, 366):
              target = root / f'day_{day:03d}.webp'
              shutil.copyfile(source, target)
              credits.append({
                  'day': day,
                  'title': 'CI compile fixture',
                  'creator': 'CI',
                  'license': 'CI fixture',
                  'licenseUrl': '',
                  'sourceUrl': 'https://github.com/adarsh8630/APP-IDEA',
                  'download4kUrl': 'https://github.com/adarsh8630/APP-IDEA',
              })
          (root / 'manifest.json').write_text(json.dumps({'count': 365, 'wallpapers': credits}))
          PY

      - name: Apply Scripture 365 iOS branding
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, plistlib
          from pathlib import Path
          from PIL import Image

          source = Image.open('../icons/Icon-512.png').convert('RGBA')
          app_icons = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          contents = json.loads((app_icons / 'Contents.json').read_text())
          for item in contents.get('images', []):
              filename, size_text, scale_text = item.get('filename'), item.get('size'), item.get('scale')
              if not filename or not size_text or not scale_text:
                  continue
              pixels = round(float(size_text.split('x')[0]) * float(scale_text.rstrip('x')))
              source.resize((pixels, pixels), Image.Resampling.LANCZOS).save(app_icons / filename)

          plist_path = Path('ios/Runner/Info.plist')
          with plist_path.open('rb') as handle:
              plist = plistlib.load(handle)
          plist['CFBundleDisplayName'] = 'Scripture 365'
          plist['CFBundleName'] = 'Scripture 365'
          with plist_path.open('wb') as handle:
              plistlib.dump(plist, handle)
          PY

      - name: Resolve iOS dependencies
        working-directory: source
        run: flutter pub get

      - name: Analyze shared application code
        working-directory: source
        run: flutter analyze

      - name: Run shared tests
        working-directory: source
        run: flutter test

      - name: Compile release app for iPhone and iPad
        working-directory: source
        run: flutter build ios --release --no-codesign --dart-define=RC_IOS_API_KEY=${{ secrets.RC_IOS_API_KEY }}

      - name: Preserve unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: scripture365-ios-unsigned-${{ github.sha }}
          path: source/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 30
